name: Build Turnip (Combined)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            suffix: ""
            extra_patch: ""
            meta_desc: ""
          - variant: a8xx
            suffix: "-A8xx"
            extra_patch: "patches/tu8_kgsl_26.patch"
            extra_script: "patches/fix_a8xx_dev_info.py:patches/apply_a8xx_gpus.py"
            meta_desc: "A8xx experimental Turnip driver for Snapdragon 8 Elite (A810/A825/A829/A830). Includes A8xx-specific patches on top of Mesa main. KGSL build."
          - variant: 710-720-test
            suffix: "-710-720-Test"
            extra_patch: ""
            extra_script: "patches/a710-720.py"
            meta_desc: "EXPERIMENTAL — Adds Adreno 710, 720, and 722 support on top of Mesa main with hardware-specific magic registers and tuned GPU properties. Unverified on real hardware — use sysmem mode. All other GPUs unaffected."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      - name: Build
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          [[ -n "${{ matrix.extra_patch }}" ]] && export EXTRA_PATCH="${{ matrix.extra_patch }}"
          [[ -n "${{ matrix.extra_script }}" ]] && export EXTRA_SCRIPT="${{ matrix.extra_script }}"
          ./build_turnip.sh

      - name: Rename ZIP
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          TAG="v${MESA_VERSION}-${BUILD_DATE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '.[].tagName' \
              | grep -oP "^v${MESA_VERSION}-${BUILD_DATE}-r\K[0-9]+$" \
              | sort -n \
              | tail -1)
            NEXT_R=$(( ${EXISTING:-1} + 1 ))
            TAG="${TAG}-r${NEXT_R}"
            echo "Tag already exists — using ${TAG}"
          fi
          if [[ "$TAG" =~ -r([0-9]+)$ ]]; then
            DAY_NUM="${BASH_REMATCH[1]}"
          else
            DAY_NUM="1"
          fi
          ZIP_NAME="Turnip-${TAG}${{ matrix.suffix }}.zip"
          SRC=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          UNZIP_DIR=$(mktemp -d)
          unzip -q "$SRC" -d "$UNZIP_DIR"
          META_NAME="Mesa Turnip ${TAG}${{ matrix.suffix }}"
          META_DESC="${{ matrix.meta_desc }}"
          python3 -c "import json,sys; p='${UNZIP_DIR}/meta.json'; m=json.load(open(p)); m['name']='${META_NAME}'; m['packageVersion']='${DAY_NUM}'; d='${META_DESC}'; m.update({'description':d} if d else {}); json.dump(m,open(p,'w'),indent=2); print('meta.json:',m['name'],'| packageVersion:',m['packageVersion'])"
          (cd "$UNZIP_DIR" && zip -q - *) > "turnip_workdir/${ZIP_NAME}"
          VK_PATCH=$(grep '^#define VK_HEADER_VERSION ' turnip_workdir/mesa/include/vulkan/vulkan_core.h | awk '{print $3}')
          VK_MINOR=$(grep 'define TU_API_VERSION' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc | grep -oP 'VK_MAKE_VERSION\(\s*[0-9]+,\s*\K[0-9]+')
          VULKAN_VERSION="Vulkan 1.${VK_MINOR}.${VK_PATCH}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "vulkan_version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Save release info
        if: matrix.variant == 'regular'
        run: |
          mkdir -p release-info
          echo "${{ steps.info.outputs.tag }}"          > release-info/tag.txt
          echo "${{ steps.info.outputs.mesa_version }}" > release-info/mesa_version.txt
          echo "${{ steps.info.outputs.build_date }}"   > release-info/build_date.txt
          echo "${{ steps.info.outputs.githash }}"      > release-info/githash.txt
          echo "${{ steps.info.outputs.githash_full }}" > release-info/githash_full.txt
          echo "${{ steps.info.outputs.commit_date }}"  > release-info/commit_date.txt
          echo "${{ steps.info.outputs.commit_title }}"    > release-info/commit_title.txt
          echo "${{ steps.info.outputs.vulkan_version }}"  > release-info/vulkan_version.txt

      - name: Upload release info
        if: matrix.variant == 'regular'
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: turnip_workdir/Turnip-*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo (for patch list)
        uses: actions/checkout@v4

      - name: Download driver ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./zips

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: ./release-info

      - name: Write release body
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          GITHASH=$(cat release-info/githash.txt)
          GITHASH_FULL=$(cat release-info/githash_full.txt)
          COMMIT_DATE=$(cat release-info/commit_date.txt)
          COMMIT_TITLE=$(cat release-info/commit_title.txt)
          VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          ZIP_REGULAR="Turnip-${TAG}.zip"
          ZIP_A8XX="Turnip-${TAG}-A8xx.zip"
          ZIP_A7XX_TEST="Turnip-${TAG}-710-720-Test.zip"
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}"
          {
            printf "> ⚠️ **AUTOMATED BUILD — Not guaranteed stable. Use at your own risk.**\n\n"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"        "${MESA_VERSION}"
            printf "| **Commit** | [\`%s\`](%s) |\n" "${GITHASH}" "${MESA_URL}"
            printf "| **Vulkan version** | %s |\n"  "${VULKAN_VERSION}"
            printf "| **Commit date** | %s |\n"    "${COMMIT_DATE}"
            printf "| **Commit title** | %s |\n"   "${COMMIT_TITLE}"
            printf "| **Build date** | %s |\n\n"   "${BUILD_DATE}"
            printf '%s\n\n' '---'
            printf "### A6xx / A7xx — What's In This Driver\n\n"
            printf "Pure Mesa \`main\` — built directly from the latest upstream commit with no source patches.\n\n"
            printf "Three inline NDK r29 compatibility fixes are applied at build time:\n\n"
            printf '%s\n' "- \`buffer_handle_t\` typedef fix (\`native_handle.h\`)"
            printf '%s\n' "- \`hnd->handle\` void-cast fix (\`u_gralloc_fallback.c\`)"
            printf '%s\n\n' "- \`native_buffer->handle\` cast fix (\`vk_android.c\`)"
            printf "Targets Snapdragon 600–800 series, 7 Gen and 8 Gen 1–3 (Adreno 600–700 series).\n\n"
            printf '%s\n\n' '---'
            printf "### A8xx — What's In This Driver\n\n"
            printf "Same NDK r29 fixes as above, plus the following A8xx-specific changes on top of Mesa \`main\`:\n\n"
            printf "**Applied via [tu8_kgsl_26.patch](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/tu8_kgsl_26.patch):**\n\n"
            printf '%s\n' "- **u_gralloc UBWC fix** — disables the \`gmsm\` magic check for Qualcomm gralloc buffer detection, which stopped working in newer gralloc versions. Without this, UBWC detection fails and you get a distorted or broken picture on screen."
            printf '%s\n\n' "- **drm-shim entries** — adds A810/A825/A829 to the Mesa drm-shim device table (used for offline tracing/testing, not runtime critical)."
            printf "**Applied via \`fix_a8xx_dev_info.py\`:**\n\n"
            printf '%s\n' "- Adds \`disable_gmem\` property to \`freedreno_dev_info.h\` — a flag that tells the driver to skip GMEM entirely for GPUs that can't use it reliably (specifically A810)."
            printf '%s\n\n' "- Adds the GMEM disable check in \`tu_cmd_buffer.cc\` so A810 uses the sysmem path instead of crashing."
            printf "**Applied via \`apply_a8xx_gpus.py\`:**\n\n"
            printf '%s\n' "- Adds **A825** GPU entry — completely missing from mesa/main."
            printf '%s\n' "- Adds \`chip_id=0x44010000\` to A810 so KGSL can identify the device."
            printf '%s\n' "- Adds \`disable_gmem = True\` to A810's GPU props."
            printf '%s\n\n' "- Adds \`chip_id=0x44030A00\` and \`chip_id=0xffff44030A00\` to A829 so additional device revisions are recognised."
            printf "**Already in mesa/main (no patching needed):**\n\n"
            printf "UBWC 5/6 KGSL support, A830/A829/A810 base entries, A8xx magic regs, reg_size fixes, and TU_DEBUG_FLUSHALL removal are all upstreamed and included automatically.\n\n"
            printf '%s\n\n' '---'
            printf "### A710 / A720 / A722 Test Build — What's In This Driver\n\n"
            printf "> ⚠️ **UNVERIFIED — Needs testing on real hardware before this is merged into the standard build.**\n\n"
            printf "Pure Mesa \`main\` plus hardware-specific GPU entries for Adreno 710, 720, and 722 injected via [\`a710-720.py\`](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/a710-720.py) (based on [Vauzi-17/710](https://github.com/Vauzi-17/710/blob/main/add_710_720_722.py)):\n\n"
            printf '%s\n' "- **A710** (\`chip_id=0x07010000\`) — hardware-specific \`fd710_raw_magic_regs\` (different UCHE cache ways, unique PC_DBG_ECO_CNTL value); \`num_ccu=3\`, \`tile_align_w=32\`, \`tile_align_h=16\`"
            printf '%s\n' "- **A720** (\`chip_id=0x43020000\`) — hardware-specific \`fd720_722_magic_regs\` and \`fd720_722_raw_magic_regs\`; \`num_ccu=3\`, \`tile_align_w=64\`, \`tile_align_h=32\`"
            printf '%s\n\n' "- **A722** (\`chip_id=0x43020100\`) — shares \`fd720_722_magic_regs\` and \`fd720_722_raw_magic_regs\` with A720; \`num_ccu=4\`, \`tile_align_w=64\`, \`tile_align_h=32\`"
            printf "All three entries include hardware-tuned sysmem cache sizes and VPC attribute buffer sizes. None of these chip IDs exist in Mesa main or the Linux kernel device catalog. The standard ZIP is completely unaffected — this variant only activates on devices reporting exactly those chip IDs.\n\n"
            printf "> **Recommended: use sysmem mode.** Force sysmem via \`TU_DEBUG=sysmem\` in your emulator/app environment until GMEM is confirmed stable on real hardware.\n\n"
            printf "> **Winlator users:** set \`WRAPPER_BLIT=1\` in your environment variables.\n\n"
            printf '%s\n\n' '---'
            printf "### Compared to the Original whitebelyash/mesa-tu8 Patchset\n\n"
            printf "Based on [patchset-head-v2](https://github.com/whitebelyash/mesa-tu8/releases/tag/patchset-head-v2). The original had 11 commits — most have since been merged into mesa/main, so this build uses only 2 of them directly:\n\n"
            printf "| Original Patch | Status |\n"
            printf "| :--- | :--- |\n"
            printf '%s\n' "| UBWC_5/6 KGSL support | ✅ Already in mesa/main — merged upstream |"
            printf '%s\n' "| u_gralloc UBWC fix | ✅ **Applied** — still needed |"
            printf '%s\n' "| disable_gmem property | ✅ **Applied** via Python script — context drifted too far to patch cleanly |"
            printf '%s\n' "| Remove TU_DEBUG_FLUSHALL | ✅ Already in mesa/main — merged upstream |"
            printf '%s\n' "| A8xx magic regs common | ❌ Dropped — register renamed (\`VPC_UNKNOWN_9313\` → \`VPC_UNKNOWN_CNTL\`), caused build failure |"
            printf '%s\n' "| A830 properties | ✅ Already in mesa/main — merged upstream |"
            printf '%s\n' "| reg_size for a8xx_gen1 | ✅ Already in mesa/main — merged upstream |"
            printf '%s\n' "| gmem cache offset | ✅ Already in mesa/main — already removed |"
            printf '%s\n' "| Enable A810/A825/A829 | ✅ **Applied** via Python script — GPU entries partially in mesa/main, script handles the rest |"
            printf '%s\n' "| drm-shim A810/A825/A829 | ✅ **Applied** — still needed |"
            printf '%s\n\n' "| Comment dual_wave_dispatch | ❌ Dropped — context drifted, upstream has it enabled |"
            printf '%s\n\n' '---'
            printf "### Adreno GPU Support\n\n"
            printf "| Series | File | Notes |\n"
            printf "| :--- | :--- | :--- |\n"
            printf "| A6xx / A7xx | \`%s\` | Pure Mesa main — Snapdragon 600–800 series, 7/8 Gen 1–3 |\n" "${ZIP_REGULAR}"
            printf "| A8xx | \`%s\` | Experimental — Snapdragon 8 Elite (A810/A825/A829/A830) |\n" "${ZIP_A8XX}"
            printf "| A710 / A720 / A722 | \`%s\` | ⚠️ UNVERIFIED — Adreno 710/720/722 test build, needs hardware testing |\n\n" "${ZIP_A7XX_TEST}"
            printf "> **Which file?**  A6xx/A7xx → standard ZIP · A8xx (Snapdragon 8 Elite) → A8xx ZIP · A710/A720/A722 owners → 710-720-Test ZIP\n\n"
            printf '%s\n\n' '---'
            printf "### Installation\n\n"
            printf '%s\n' "- **BannerHub / BCI:** Component Manager → Add New Component → select the ZIP"
            printf '%s\n' "- **Winlator / adrenotools:** load the ZIP in GPU driver settings"
          } > release_body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Turnip ${TAG}" \
            --notes-file release_body.md \
            zips/*.zip

      - name: Update README with build info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin A8xx
          git checkout A8xx
          git pull --rebase origin A8xx
          export BT_TAG=$(cat release-info/tag.txt)
          export BT_MESA_VERSION=$(cat release-info/mesa_version.txt)
          export BT_BUILD_DATE=$(cat release-info/build_date.txt)
          export BT_GITHASH=$(cat release-info/githash.txt)
          export BT_GITHASH_FULL=$(cat release-info/githash_full.txt)
          export BT_COMMIT_DATE=$(cat release-info/commit_date.txt)
          export BT_COMMIT_TITLE=$(cat release-info/commit_title.txt)
          export BT_VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          export BT_REPO="$GITHUB_REPOSITORY"
          python3 .github/scripts/update_readme.py
          python3 .github/scripts/update_builds.py
          git add README.md Mesa-commit-history.md
          git diff --staged --quiet || git commit -m "docs: update build info [$BT_TAG]"
          git push origin A8xx