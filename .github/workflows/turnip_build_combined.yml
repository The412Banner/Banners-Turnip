# BRANCH-ONLY (feat/a722-upstream, never merge this file): turnip_build_combined.yml replaced by the A722 lab build.
# Branch-only lab workflow (feat/a722-upstream): builds several Android KGSL Turnip drivers in one
# run, each = Mesa at one pinned commit + the lab steps named in "variants". No release, no README.
name: A722 lab build

on:
  workflow_dispatch:
    inputs:
      mesa_commit:
        description: "Full 40-hex Mesa commit"
        required: true
      variants:
        description: 'JSON list: [{"name":"up","steps":""},{"name":"own722","steps":"own722"}]'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch ccache
          pip3 install --break-system-packages meson mako

      - name: Build
        shell: bash
        env:
          MESA_COMMIT: ${{ inputs.mesa_commit }}
          LAB_STEPS: ${{ matrix.v.steps }}
          EXTRA_SCRIPT: patches/a722-lab/lab.py
          META_NAME: LAB-${{ github.run_number }}-${{ matrix.v.name }}
          META_DESC: "A722 lab build (feat/a722-upstream, not a release). Mesa ${{ inputs.mesa_commit }} + steps: ${{ matrix.v.steps }}"
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh 2>&1 | tee build.log
          grep -q '^\[lab\] steps:' build.log || { echo "lab.py did not run"; exit 1; }
          z=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          [ -f "$z" ] || { echo "no zip"; exit 1; }
          mkdir out && cd out && unzip -q "../$z"
          test -s libvulkan_freedreno.so && test -s meta.json
          python3 -c "import json;m=json.load(open('meta.json'));assert m['name']=='LAB-${{ github.run_number }}-${{ matrix.v.name }}',m['name'];print(m)"
          git -C ../turnip_workdir/mesa rev-parse HEAD > mesa_commit.txt
          echo "${LAB_STEPS}" > lab_steps.txt
          sha256sum libvulkan_freedreno.so | tee so.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.v.name }}
          path: out/
          retention-days: 7
