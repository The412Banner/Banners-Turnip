name: Build Turnip (Combined)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            suffix: ""
            extra_patch: ""
            meta_desc: ""
          - variant: a8xx
            suffix: "-A8xx"
            extra_patch: "patches/a8xx_gen8.patch"
            extra_script: "patches/a8xx_shared_mem.py"
            meta_desc: "A8xx experimental Turnip driver for Snapdragon 8 Elite (A840/A830/A829/A825/A810). whitebelyash turnip/gen8 A8xx stack on top of Mesa main (matches tu_v29 / StevenMXZ v33). KGSL build."
          - variant: 710-720-test
            suffix: "-710-720-Test"
            extra_patch: ""
            extra_script: "patches/a710-720.py"
            meta_desc: "EXPERIMENTAL — Adds Adreno 710, 720, and 722 support on top of Mesa main with hardware-specific magic registers and tuned GPU properties. Unverified on real hardware — use sysmem mode. All other GPUs unaffected."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      - name: Build
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          [[ -n "${{ matrix.extra_patch }}" ]] && export EXTRA_PATCH="${{ matrix.extra_patch }}"
          [[ -n "${{ matrix.extra_script }}" ]] && export EXTRA_SCRIPT="${{ matrix.extra_script }}"
          ./build_turnip.sh

      - name: Rename ZIP
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          TAG="v${MESA_VERSION}-${BUILD_DATE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '.[].tagName' \
              | grep -oP "^v${MESA_VERSION}-${BUILD_DATE}-r\K[0-9]+$" \
              | sort -n \
              | tail -1)
            NEXT_R=$(( ${EXISTING:-1} + 1 ))
            TAG="${TAG}-r${NEXT_R}"
            echo "Tag already exists — using ${TAG}"
          fi
          if [[ "$TAG" =~ -r([0-9]+)$ ]]; then
            DAY_NUM="${BASH_REMATCH[1]}"
          else
            DAY_NUM="1"
          fi
          ZIP_NAME="Turnip-${TAG}${{ matrix.suffix }}.zip"
          SRC=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          UNZIP_DIR=$(mktemp -d)
          unzip -q "$SRC" -d "$UNZIP_DIR"
          META_NAME="Mesa Turnip ${TAG}${{ matrix.suffix }}"
          META_DESC="${{ matrix.meta_desc }}"
          python3 -c "import json,sys; p='${UNZIP_DIR}/meta.json'; m=json.load(open(p)); m['name']='${META_NAME}'; m['packageVersion']='${DAY_NUM}'; d='${META_DESC}'; m.update({'description':d} if d else {}); json.dump(m,open(p,'w'),indent=2); print('meta.json:',m['name'],'| packageVersion:',m['packageVersion'])"
          (cd "$UNZIP_DIR" && zip -q - *) > "turnip_workdir/${ZIP_NAME}"
          VK_PATCH=$(grep '^#define VK_HEADER_VERSION ' turnip_workdir/mesa/include/vulkan/vulkan_core.h | awk '{print $3}')
          VK_MINOR=$(grep 'define TU_API_VERSION' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc | grep -oP 'VK_MAKE_VERSION\(\s*[0-9]+,\s*\K[0-9]+')
          VULKAN_VERSION="Vulkan 1.${VK_MINOR}.${VK_PATCH}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "vulkan_version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Save release info
        if: matrix.variant == 'regular'
        env:
          RI_TAG: ${{ steps.info.outputs.tag }}
          RI_MESA_VERSION: ${{ steps.info.outputs.mesa_version }}
          RI_BUILD_DATE: ${{ steps.info.outputs.build_date }}
          RI_GITHASH: ${{ steps.info.outputs.githash }}
          RI_GITHASH_FULL: ${{ steps.info.outputs.githash_full }}
          RI_COMMIT_DATE: ${{ steps.info.outputs.commit_date }}
          RI_COMMIT_TITLE: ${{ steps.info.outputs.commit_title }}
          RI_VULKAN_VERSION: ${{ steps.info.outputs.vulkan_version }}
        run: |
          mkdir -p release-info
          printf '%s\n' "$RI_TAG"          > release-info/tag.txt
          printf '%s\n' "$RI_MESA_VERSION" > release-info/mesa_version.txt
          printf '%s\n' "$RI_BUILD_DATE"   > release-info/build_date.txt
          printf '%s\n' "$RI_GITHASH"      > release-info/githash.txt
          printf '%s\n' "$RI_GITHASH_FULL" > release-info/githash_full.txt
          printf '%s\n' "$RI_COMMIT_DATE"  > release-info/commit_date.txt
          printf '%s\n' "$RI_COMMIT_TITLE" > release-info/commit_title.txt
          printf '%s\n' "$RI_VULKAN_VERSION" > release-info/vulkan_version.txt

      - name: Upload release info
        if: matrix.variant == 'regular'
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: turnip_workdir/Turnip-*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo (for patch list)
        uses: actions/checkout@v4

      - name: Download driver ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./zips

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: ./release-info

      - name: Write release body
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          GITHASH=$(cat release-info/githash.txt)
          GITHASH_FULL=$(cat release-info/githash_full.txt)
          COMMIT_DATE=$(cat release-info/commit_date.txt)
          COMMIT_TITLE=$(cat release-info/commit_title.txt)
          VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          ZIP_REGULAR="Turnip-${TAG}.zip"
          ZIP_A8XX="Turnip-${TAG}-A8xx.zip"
          ZIP_A7XX_TEST="Turnip-${TAG}-710-720-Test.zip"
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}"
          {
            printf "> ⚠️ **AUTOMATED BUILD — Not guaranteed stable. Use at your own risk.**\n\n"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"        "${MESA_VERSION}"
            printf "| **Commit** | [\`%s\`](%s) |\n" "${GITHASH}" "${MESA_URL}"
            printf "| **Vulkan version** | %s |\n"  "${VULKAN_VERSION}"
            printf "| **Commit date** | %s |\n"    "${COMMIT_DATE}"
            printf "| **Commit title** | %s |\n"   "${COMMIT_TITLE}"
            printf "| **Build date** | %s |\n\n"   "${BUILD_DATE}"
            printf '%s\n\n' '---'
            printf "### A6xx / A7xx — Standard\n\n"
            printf "The everyday driver for most Adreno phones — **Snapdragon 600–800 series** (7 Gen, 8 Gen 1–3). Built straight from the latest upstream Mesa with no extra patches, so it's the safest, most-compatible pick. Not sure which file to grab? It's this one.\n\n"
            printf '<details>\n<summary>Technical details</summary>\n\n'
            printf "Pure Mesa \`main\` (latest upstream commit, no source patches). Three inline NDK r29 compatibility fixes applied at build time:\n\n"
            printf '%s\n' "- \`buffer_handle_t\` typedef fix (\`native_handle.h\`)"
            printf '%s\n' "- \`hnd->handle\` void-cast fix (\`u_gralloc_fallback.c\`)"
            printf '%s\n\n' "- \`native_buffer->handle\` cast fix (\`vk_android.c\`)"
            printf '</details>\n\n'
            printf '%s\n\n' '---'
            printf "### A8xx — Snapdragon 8 Elite\n\n"
            printf "For the newest **Snapdragon 8 Elite** phones — **Adreno 840 / 830 / 829 / 825 / 810**. This is the same A8xx driver the community runs — whitebelyash's \`turnip/gen8\` stack (as shipped in [tu_v29](https://github.com/whitebelyash/AdrenoToolsDrivers/releases/tag/tu_v29) and [StevenMXZ v33](https://github.com/StevenMXZ/Adreno-Tools-Drivers/releases/tag/v33)) — rebuilt on the latest Mesa. Still experimental, so a couple of tips:\n\n"
            printf '%s\n' "- **A830 looking glitchy?** Add \`TU_DEBUG=sysmem\` to your environment."
            printf '%s\n\n' "- **A game won't start on Qualcomm?** Try \`TU_DEBUG=deck_emu\` (spoofs a Steam Deck)."
            printf '<details>\n<summary>Technical details — patches and provenance</summary>\n\n'
            printf "Built from **[whitebelyash/mesa-unified](https://github.com/whitebelyash/mesa-unified) \`turnip/gen8\`** — the canonical A8xx Turnip stack, curated to his A8xx-relevant commits (cosmetic driver-string/versioning commits and anything already in Mesa \`main\` are dropped, so this rides bleeding-edge Mesa while carrying his tuning). Credit: **whitebelyash**.\n\n"
            printf "**Applied via [a8xx_gen8.patch](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/a8xx_gen8.patch) (13 commits):**\n\n"
            printf '%s\n' "- **A825 enablement** + updated A8xx family configs (\`gmem_size\`, \`disable_gmem\`)."
            printf '%s\n' "- **A825/A829 offset fixes** and **A810 custom-resolve / off-MSAA / FDM** (A810/825/829/830) tuning."
            printf '%s\n' "- **A810 UBO-promotion coalescing** (ir3) + **u_gralloc always-UBWC** detection + drm-shim entries."
            printf '%s\n' "- whitebelyash HACKs: **VK1.3 without multiview**, **enforce \`TU_DEBUG=nocb\`**, selected **A810 feature disables**, SteamDeck spoof."
            printf '%s\n\n' "- \`a8xx_shared_mem.py\`: raises A8xx compute shared-mem 32→64 KiB."
            printf "**Already in Mesa \`main\` (no patch needed):** A840 (\`0xffff44050A31\`), A613, A830 properties, magic regs, UBWC 5/6 KGSL, reg_size fixes.\n\n"
            printf "> ⚠️ Compile-verified only — not yet device-proven; A8xx owners please test and report.\n\n"
            printf '</details>\n\n'
            printf '%s\n\n' '---'
            printf "### A710 / A720 / A722 — Experimental\n\n"
            printf "An experimental test build adding **Adreno 710 / 720 / 722** support (these chips aren't in upstream Mesa yet). ⚠️ **Not yet verified on real hardware.** If you try it:\n\n"
            printf '%s\n' "- Set \`TU_DEBUG=sysmem\` in your emulator/app environment."
            printf '%s\n\n' "- **Winlator users:** also set \`WRAPPER_BLIT=1\`."
            printf "It won't affect any other GPU — it only activates on those exact chip IDs, and the standard ZIP is completely unaffected.\n\n"
            printf '<details>\n<summary>Technical details</summary>\n\n'
            printf "Pure Mesa \`main\` plus per-GPU entries injected via [\`a710-720.py\`](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/a710-720.py) (from [Vauzi-17/710](https://github.com/Vauzi-17/710/blob/main/add_710_720_722.py)), using hardware-captured magic registers:\n\n"
            printf '%s\n' "- **A710** (\`0x07010000\`) — per-GPU \`a710_raw_magic_regs\` from real A710 blob traces."
            printf '%s\n' "- **A720** (\`0x43020000\`) — per-GPU \`a720_raw_magic_regs\` from real A720 blob traces."
            printf '%s\n\n' "- **A722** (\`0x43020100\`) — per-GPU \`a722_raw_magic_regs\` (distinct \`PC_MODE_CNTL=0x3f\`, \`UCHE_CACHE_WAYS=0x0\`)."
            printf "\`num_ccu=1\`, \`tile_align_w=64\`, \`tile_align_h=32\`; other properties inherited from Mesa's \`a7xx_base\`/\`a7xx_gen1\`. None of these chip IDs exist in Mesa main or the Linux kernel device catalog.\n\n"
            printf '</details>\n\n'
            printf '%s\n\n' '---'
            printf "### Adreno GPU Support\n\n"
            printf "| Series | File | Notes |\n"
            printf "| :--- | :--- | :--- |\n"
            printf "| A6xx / A7xx | \`%s\` | Pure Mesa main — Snapdragon 600–800 series, 7/8 Gen 1–3 |\n" "${ZIP_REGULAR}"
            printf "| A8xx | \`%s\` | Experimental — Snapdragon 8 Elite (A840/A830/A829/A825/A810) |\n" "${ZIP_A8XX}"
            printf "| A710 / A720 / A722 | \`%s\` | ⚠️ UNVERIFIED — Adreno 710/720/722 test build, needs hardware testing |\n\n" "${ZIP_A7XX_TEST}"
            printf "> **Which file?**  A6xx/A7xx → standard ZIP · A8xx (Snapdragon 8 Elite) → A8xx ZIP · A710/A720/A722 owners → 710-720-Test ZIP\n\n"
            printf '%s\n\n' '---'
            printf "### Installation\n\n"
            printf '%s\n' "- **BannerHub / BCI:** Component Manager → Add New Component → select the ZIP"
            printf '%s\n' "- **Winlator / adrenotools:** load the ZIP in GPU driver settings"
          } > release_body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Turnip ${TAG}" \
            --notes-file release_body.md \
            zips/*.zip

      - name: Update README with build info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin A8xx
          git checkout A8xx
          git pull --rebase origin A8xx
          export BT_TAG=$(cat release-info/tag.txt)
          export BT_MESA_VERSION=$(cat release-info/mesa_version.txt)
          export BT_BUILD_DATE=$(cat release-info/build_date.txt)
          export BT_GITHASH=$(cat release-info/githash.txt)
          export BT_GITHASH_FULL=$(cat release-info/githash_full.txt)
          export BT_COMMIT_DATE=$(cat release-info/commit_date.txt)
          export BT_COMMIT_TITLE=$(cat release-info/commit_title.txt)
          export BT_VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          export BT_REPO="$GITHUB_REPOSITORY"
          python3 .github/scripts/update_readme.py
          python3 .github/scripts/update_builds.py
          git add README.md Mesa-commit-history.md
          git diff --staged --quiet || git commit -m "docs: update build info [$BT_TAG]"
          git push origin A8xx