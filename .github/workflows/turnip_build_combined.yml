name: Build Turnip (Combined)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            suffix: ""
            extra_patch: ""
          - variant: a8xx
            suffix: "-A8xx"
            extra_patch: "patches/tu8_kgsl_26.patch"
            extra_script: "patches/fix_a8xx_dev_info.py:patches/apply_a8xx_gpus.py"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      - name: Build
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          [[ -n "${{ matrix.extra_patch }}" ]] && export EXTRA_PATCH="${{ matrix.extra_patch }}"
          [[ -n "${{ matrix.extra_script }}" ]] && export EXTRA_SCRIPT="${{ matrix.extra_script }}"
          ./build_turnip.sh

      - name: Rename ZIP
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          TAG="v${MESA_VERSION}-${BUILD_DATE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '.[].tagName' \
              | grep -oP "^v${MESA_VERSION}-${BUILD_DATE}-r\K[0-9]+$" \
              | sort -n \
              | tail -1)
            NEXT_R=$(( ${EXISTING:-1} + 1 ))
            TAG="${TAG}-r${NEXT_R}"
            echo "Tag already exists — using ${TAG}"
          fi
          ZIP_NAME="Turnip-${TAG}${{ matrix.suffix }}.zip"
          SRC=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          cp "$SRC" "turnip_workdir/${ZIP_NAME}"
          VK_PATCH=$(grep '^#define VK_HEADER_VERSION ' turnip_workdir/mesa/include/vulkan/vulkan_core.h | awk '{print $3}')
          VK_MINOR=$(grep 'define TU_API_VERSION' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc | grep -oP 'VK_MAKE_VERSION\(\s*[0-9]+,\s*\K[0-9]+')
          VULKAN_VERSION="Vulkan 1.${VK_MINOR}.${VK_PATCH}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "vulkan_version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Save release info
        if: matrix.variant == 'regular'
        run: |
          mkdir -p release-info
          echo "${{ steps.info.outputs.tag }}"          > release-info/tag.txt
          echo "${{ steps.info.outputs.mesa_version }}" > release-info/mesa_version.txt
          echo "${{ steps.info.outputs.build_date }}"   > release-info/build_date.txt
          echo "${{ steps.info.outputs.githash }}"      > release-info/githash.txt
          echo "${{ steps.info.outputs.githash_full }}" > release-info/githash_full.txt
          echo "${{ steps.info.outputs.commit_date }}"  > release-info/commit_date.txt
          echo "${{ steps.info.outputs.commit_title }}"    > release-info/commit_title.txt
          echo "${{ steps.info.outputs.vulkan_version }}"  > release-info/vulkan_version.txt

      - name: Upload release info
        if: matrix.variant == 'regular'
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: turnip_workdir/Turnip-*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo (for patch list)
        uses: actions/checkout@v4

      - name: Download driver ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./zips

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: ./release-info

      - name: Write release body
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          GITHASH=$(cat release-info/githash.txt)
          GITHASH_FULL=$(cat release-info/githash_full.txt)
          COMMIT_DATE=$(cat release-info/commit_date.txt)
          COMMIT_TITLE=$(cat release-info/commit_title.txt)
          ZIP_REGULAR="Turnip-${TAG}.zip"
          ZIP_A8XX="Turnip-${TAG}-A8xx.zip"
          VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}"
          A8XX_PATCH_COUNT=$(grep -c "^Subject:" patches/tu8_kgsl_26.patch || echo "?")
          A8XX_PATCH_LINES=$(grep "^Subject:" patches/tu8_kgsl_26.patch \
            | sed 's/^Subject: \[PATCH [0-9]*\/[0-9]*\] //' \
            | while read -r line; do printf "  - %s\n" "$line"; done)
          {
            printf "> ⚠️ **AUTOMATED BUILD — Not guaranteed stable. Use at your own risk.**\n\n"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"       "${MESA_VERSION}"
            printf "| **Commit** | [\`%s\`](%s) |\n" "${GITHASH}" "${MESA_URL}"
            printf "| **Vulkan version** | %s |\n" "${VULKAN_VERSION}"
            printf "| **Commit date** | %s |\n"   "${COMMIT_DATE}"
            printf "| **Commit title** | %s |\n"  "${COMMIT_TITLE}"
            printf "| **Build date** | %s |\n\n"  "${BUILD_DATE}"
            printf '%s\n\n' '---'
            printf "### Patches Applied\n\n"
            printf "**A6xx / A7xx (standard)**\n\n"
            printf "Pure Mesa \`main\` — no source patches. Three inline NDK r29 compatibility fixes applied at build time:\n\n"
            printf "  - \`buffer_handle_t\` typedef fix (\`native_handle.h\`)\n"
            printf "  - \`hnd->handle\` void-cast fix (\`u_gralloc_fallback.c\`)\n"
            printf "  - \`native_buffer->handle\` cast fix (\`vk_android.c\`)\n\n"
            printf "**A8xx (experimental)**\n\n"
            printf "Same NDK r29 fixes as above, plus:\n\n"
            printf '%s\n' "- \`patches/tu8_kgsl_26.patch\` — [whitebelyash/mesa-tu8 patchset-head-v2](https://github.com/whitebelyash/mesa-tu8/releases/tag/patchset-head-v2) (${A8XX_PATCH_COUNT} commits):"
            printf "%s\n" "${A8XX_PATCH_LINES}"
            printf '%s\n' "- \`patches/fix_a8xx_dev_info.py\` — re-adds only \`disable_gmem\` to \`freedreno_dev_info.h\` (skips \`has_image_processing\` already merged upstream)"
            printf '%s\n\n' "- \`patches/apply_a8xx_gpus.py\` — ensures A810/A825/A829 GPU entries in \`freedreno_devices.py\` (fallback if patch hunks drift)"
            printf '%s\n\n' '---'
            printf "### Adreno GPU Support\n\n"
            printf "| Series | File | Notes |\n"
            printf "| :--- | :--- | :--- |\n"
            printf "| A6xx / A7xx | \`%s\` | Pure Mesa main — Snapdragon 600–800 series, 7/8 Gen 1–3 |\n" "${ZIP_REGULAR}"
            printf "| A8xx | \`%s\` | Experimental — Snapdragon 8 Elite (A810/A825/A829/A830) |\n\n" "${ZIP_A8XX}"
            printf "> **Which file?**  A6xx/A7xx → standard ZIP · A8xx (Snapdragon 8 Elite) → A8xx ZIP\n\n"
            printf '%s\n\n' '---'
            printf "### Installation\n\n"
            printf '%s\n' "- **BannerHub / BCI:** Component Manager → Add New Component → select the ZIP"
            printf '%s\n' "- **Winlator / adrenotools:** load the ZIP in GPU driver settings"
          } > release_body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Turnip ${MESA_VERSION} — ${BUILD_DATE}" \
            --notes-file release_body.md \
            zips/*.zip

      - name: Update README with build info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin A8xx
          git checkout A8xx
          git pull --rebase origin A8xx
          export BT_TAG=$(cat release-info/tag.txt)
          export BT_MESA_VERSION=$(cat release-info/mesa_version.txt)
          export BT_BUILD_DATE=$(cat release-info/build_date.txt)
          export BT_GITHASH=$(cat release-info/githash.txt)
          export BT_GITHASH_FULL=$(cat release-info/githash_full.txt)
          export BT_COMMIT_DATE=$(cat release-info/commit_date.txt)
          export BT_COMMIT_TITLE=$(cat release-info/commit_title.txt)
          export BT_VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          export BT_REPO="$GITHUB_REPOSITORY"
          python3 .github/scripts/update_readme.py
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update build info [$BT_TAG]"
          git push origin A8xx