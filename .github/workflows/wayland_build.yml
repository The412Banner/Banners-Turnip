name: Build Wayland variant (Turnip WSI + EGL/Zink)

# Only this branch, and only when the Wayland build itself changes. No release is published:
# the result is a workflow artifact for the Bannerlator Wayland Proton build: four Turnip drivers
# (plain, a7xx, a8xx, a8xx_perf, each from its own Mesa pin) with their ICD manifests, Mesa EGL +
# Zink, the Termux libs they link, and the recipe logs; BUILD-INFO.txt (also the job summary)
# records each driver's Mesa commit and upstream release.
on:
  workflow_dispatch:
  push:
    branches: [wayland]
    paths:
      - build_wayland.sh
      - 'patches/wayland/**'
      # The a7xx / a8xx driver variants are community recipes vendored under patches/upstream.
      - 'patches/upstream/**'
      - 'patches/termux/**'
      - build_turnip_wayland_wsi.sh
      - mesa_hash.txt
      - mesa_wayland_ref.txt
      - .github/workflows/wayland_build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison glslang-tools curl ccache pkg-config \
            clang lld llvm python3-pip
          pip3 install --break-system-packages meson mako pyyaml packaging

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: wayland_workdir/android-ndk-r29
          key: ndk-r29-linux

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wayland-${{ hashFiles('mesa_hash.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-wayland-${{ hashFiles('mesa_hash.txt') }}-
            ccache-wayland-

      - name: Build
        run: |
          ccache -M 2G
          chmod +x build_wayland.sh
          ./build_wayland.sh
          ccache -s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: banner-mesa-wayland
          path: wayland_workdir/banner-mesa-wayland/

  turnip-combined:
    # The release recipe plus the Wayland WSI: one AdrenoTools-style zip for X11 and Wayland.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison glslang-tools curl ccache pkg-config \
            clang lld llvm python3-pip zip
          pip3 install --break-system-packages meson mako pyyaml packaging

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: wayland_workdir/android-ndk-r29
          key: ndk-r29-linux

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-combined-${{ hashFiles('mesa_hash.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-combined-${{ hashFiles('mesa_hash.txt') }}-
            ccache-combined-

      - name: Build
        run: |
          ccache -M 2G
          ./build_turnip_wayland_wsi.sh
          ccache -s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: turnip-combined-wayland
          path: wayland_workdir/turnip-combined/
