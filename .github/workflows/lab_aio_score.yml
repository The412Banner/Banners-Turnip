name: Lab - DriverLab source-code accuracy on r2 Banners-AIO

# Lab branch only, never merged, publishes nothing. Builds the DriverLab inspector engine for
# the CI machine (rizin v0.9.1 + rz-ghidra v0.9.0, the versions the app bundles), runs the app's
# Make source code commands on the released r2 Banners-AIO driver and scores them against the
# symbol table of the same build (run 42202951420) and file:line from the -g build (run 42202362422).
on:
  push:
    branches: [lab/aio-debug-r2]
    paths: ['lab/**', '.github/workflows/lab_aio_score.yml']

permissions:
  contents: read
  actions: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config llvm unzip
          pip3 install --break-system-packages 'meson>=1.5' pyelftools

      - name: Engine cache
        id: cache
        uses: actions/cache@v4
        with:
          path: eng/host
          key: rz-v0.9.1-ghidra-v0.9.0-${{ runner.os }}-host-v1

      - name: Build rizin v0.9.1 + rz-ghidra v0.9.0 (as native/inspect/build-inspect.sh, host part)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          W=$PWD/eng; mkdir -p $W; cd $W
          git clone -q --depth 1 -b v0.9.1 https://github.com/rizinorg/rizin
          git clone -q --depth 1 -b v0.9.0 --recurse-submodules --shallow-submodules https://github.com/rizinorg/rz-ghidra
          meson setup rz-host rizin --buildtype release --prefix="$W/host" -Denable_tests=false > rz-setup.log 2>&1 || { tail -50 rz-setup.log; exit 1; }
          ninja -C rz-host install > rz-build.log 2>&1 || { tail -50 rz-build.log; exit 1; }
          cmake -S rz-ghidra -B gh-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$W/host" -DCMAKE_INSTALL_PREFIX="$W/host" -DBUILD_SLEIGH_PLUGIN=OFF > gh-setup.log 2>&1 || { tail -50 gh-setup.log; exit 1; }
          cmake --build gh-host -j "$(nproc)" > gh-build.log 2>&1 || { tail -50 gh-build.log; exit 1; }
          cmake --install gh-host > gh-install.log 2>&1 || { tail -50 gh-install.log; exit 1; }

      - name: Engine paths
        run: |
          W=$PWD/eng
          echo "RIZIN=$W/host/bin/rizin" >> "$GITHUB_ENV"
          echo "GHIDRA_PLUGIN=$(find $W/host -name 'core_ghidra.so' | head -1)" >> "$GITHUB_ENV"
          echo "SLEIGH=$(dirname "$(find $W/host -name 'AARCH64.sla' | head -1)")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$W/host/lib:$W/host/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "SYMBOLIZER=$(command -v llvm-symbolizer)" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$W/host/lib:$W/host/lib/x86_64-linux-gnu $W/host/bin/rizin -v | head -2

      - name: Get the drivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rel sym dbg
          gh release download v27.0.0-20261106-r2 -R "${{ github.repository }}" -p 'Turnip-v27.0.0-20261106-r2-Banners-AIO.zip' -D rel
          unzip -o -q rel/*.zip -d rel
          gh run download 42202951420 -R "${{ github.repository }}" -n aio-r2-symtab -D sym
          gh run download 42202362422 -R "${{ github.repository }}" -n aio-r2-debug -D dbg
          gh run download 42209617852 -R "${{ github.repository }}" -n symbols-aio -D names
          sha256sum rel/libvulkan_freedreno.so sym/libvulkan_freedreno-debug.so dbg/libvulkan_freedreno-debug.so
          cat sym/compare.txt | tail -3

      - name: Score
        run: |
          echo "engine: $RIZIN / $GHIDRA_PLUGIN / $SLEIGH"
          if [ -f lab/RUN_PROBE ]; then
            python3 lab/probe.py rel/libvulkan_freedreno.so sym/libvulkan_freedreno-debug.so names/symbols-*.tsv.gz out
          else
            python3 lab/score.py rel/libvulkan_freedreno.so sym/libvulkan_freedreno-debug.so dbg/libvulkan_freedreno-debug.so out
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aio-r2-score
          path: out/
