name: Build Turnip A750 MTR (Balanced + Performance)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      # ── Balanced build: GMEM force only, no clock locking ─────────────────
      - name: Build Balanced (-b)
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          export BUILD_SUFFIX="a750-mtr-b"
          export META_NAME="Turnip A750 MTR Balanced"
          export META_DESC="A750 MTR balanced: forced GMEM tile rendering. No clock forcing. Mesa main."
          export EXTRA_SCRIPT="patches/apply_mtr_gmem_force.py"
          ./build_turnip.sh

      # ── Performance build: GMEM force + PWR_MAX clock lock ────────────────
      - name: Build Performance (-p)
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          export BUILD_SUFFIX="a750-mtr-p"
          export META_NAME="Turnip A750 MTR Performance"
          export META_DESC="A750 MTR performance: forced GMEM tile rendering + PWR_MAX GPU clock lock (refreshed every 1000 subs). Mesa main."
          export EXTRA_SCRIPT="patches/apply_mtr_gmem_force.py:patches/apply_mtr_pwr_max.py"
          export SKIP_SOURCE_DOWNLOAD="1"
          ./build_turnip.sh

      # ── Collect build info ─────────────────────────────────────────────────
      - name: Read build info
        id: info
        run: |
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          TAG="v${MESA_VERSION}-${BUILD_DATE}-a750-mtr"
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A750-MTR-${{ steps.info.outputs.tag }}
          path: turnip_workdir/*a750-mtr*.zip
