name: Build Turnip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip ccache
          pip3 install --break-system-packages meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip.sh

      - name: Load build info
        id: info
        run: |
          source turnip_workdir/build_info.env
          ZIP=$(ls turnip_workdir/Turnip-*.zip | head -1)
          FILENAME=$(basename "$ZIP")
          TAG="v${MESA_VERSION}-${BUILD_DATE}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Write release body
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          MESA_VERSION="${{ steps.info.outputs.mesa_version }}"
          BUILD_DATE="${{ steps.info.outputs.build_date }}"
          GITHASH="${{ steps.info.outputs.githash }}"
          GITHASH_FULL="${{ steps.info.outputs.githash_full }}"
          COMMIT_DATE="${{ steps.info.outputs.commit_date }}"
          COMMIT_TITLE="${{ steps.info.outputs.commit_title }}"
          FILENAME="${{ steps.info.outputs.filename }}"

          cat > release_body.md << BODYEOF
          > ⚠️ **NIGHTLY / MANUAL BUILD — Not guaranteed stable. Use at your own risk.**

          ---

          ### 🚀 Turnip Vulkan Driver: ${TAG}

          ---

          ### 📊 Mesa Upstream Status

          | | Details |
          | :--- | :--- |
          | **Source** | [mesa/mesa · main](https://gitlab.freedesktop.org/mesa/mesa) |
          | **Commit** | [\`${GITHASH}\`](https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}) |
          | **Commit date** | ${COMMIT_DATE} |
          | **Commit title** | ${COMMIT_TITLE} |
          | **Mesa version** | ${MESA_VERSION} |
          | **Build date** | ${BUILD_DATE} |
          | **Patches applied** | None — pure Mesa main |

          ---

          ### 📦 Built Components

          | Component | Details |
          | :--- | :--- |
          | **Turnip (Freedreno Vulkan)** | Mesa ${MESA_VERSION} · commit [\`${GITHASH}\`](https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}) |
          | **Build type** | KGSL (no root required) |
          | **Target arch** | Android aarch64 |
          | **Min API** | 28 (Android 9) |
          | **Vulkan** | 1.4 |

          ---

          ### 📱 Compatible Adreno Devices

          | Series | GPUs |
          | :--- | :--- |
          | **A6xx** | 610, 612, 615, 616, 618, 620, 630, 640, 642, 642L, 643, 644, 650, 660, 675, 680, 685, 690 |
          | **A7xx** | 710, 720, 725, 730, 732, 735, 740, 750 |
          | **A8xx** | 810, 820, 825, 830 |

          > **Which series is my phone?** Check your SoC — Snapdragon 7/8 Gen 1–2 → A7xx · Snapdragon 8 Gen 3+ → A8xx · Snapdragon 600–800 series (2019–2021) → A6xx

          ---

          ### ⬇️ Download

          | File | Description |
          | :--- | :--- |
          | \`${FILENAME}\` | ZIP for BannerHub / BannersComponentInjector injection or adrenotools |

          **How to install:**
          - **BannerHub / BCI:** Inject the `.zip` directly via Component Manager → Add New Component
          - **Winlator:** Settings → Turnip driver → load the `.zip`
          - **adrenotools:** Load the `.zip` in any adrenotools-compatible app
          BODYEOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-${{ steps.info.outputs.tag }}
          path: turnip_workdir/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Turnip ${{ steps.info.outputs.mesa_version }} — ${{ steps.info.outputs.build_date }}"
          prerelease: false
          make_latest: true
          body_path: ${{ github.workspace }}/release_body.md
          files: turnip_workdir/*.zip
