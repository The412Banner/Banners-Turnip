name: Build Turnip Dual

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools
          pip3 install --upgrade meson mako

      - name: Tornar o Script Executável
        run: chmod +x turnip_builder.sh

      - name: Compilar Drivers (Dual Build)
        run: ./turnip_builder.sh

      # Lê o nome da Tag gerada pelo último driver compilado para usar no título da Release
      - name: Ler Metadados
        id: meta
        run: |
          echo "TAG_NAME=$(cat turnip_workdir/tag)" >> $GITHUB_ENV
          echo "RELEASE_NAME=Turnip Dual Release (Gen8 + Main)" >> $GITHUB_ENV

      # Upload na aba "Actions" (Salva todos os ZIPs encontrados)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers-Pack
          path: turnip_workdir/*.zip
          if-no-files-found: error

      # Cria a Release e anexa TODOS os ZIPs da pasta
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Build automática contendo dois drivers:
            1. **Gen8 (WhiteBelyash):** Mesh/RT desbloqueados + Wrapper Variable Fix.
            2. **Main (Official):** Ray Tracing Inteligente (A7xx) + Comportamento Padrão.
          files: turnip_workdir/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
