name: Build Turnip 

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf flex bison glslang-tools git python3-pip
          pip3 install meson mako --break-system-packages

      - name: Build
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip
