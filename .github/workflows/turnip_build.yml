name: Build Turnip 

on:
  workflow_dispatch: # Botão para iniciar manualmente
  
     # Executa automaticamente a cada 12 horas

# Permissões necessárias para criar Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools
          pip3 install --upgrade meson mako

      - name: Tornar o Script Executável
        run: chmod +x turnip_builder.sh

      - name: Compilar Driver (Ultimate Unlock)
        run: ./turnip_builder.sh

      # Identifica o ZIP gerado independentemente do nome (Mesa-Main, Turnip, etc)
      - name: Ler Metadados da Release
        id: meta
        run: |
          echo "TAG_NAME=$(cat turnip_workdir/tag)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(cat turnip_workdir/release)" >> $GITHUB_ENV
          echo "ZIP_PATH=$(ls turnip_workdir/*.zip | head -n 1)" >> $GITHUB_ENV

      # Faz upload do arquivo para a aba "Actions" (Backup)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Ultimate-Driver
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      # Cria a Release oficial na aba "Releases"
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: turnip_workdir/description
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
