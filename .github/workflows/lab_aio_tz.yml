name: Lab - Banners-AIO TurnipZ port

# Lab branch feat/aio-tz only, never merged as is. Banners-AIO recipe + the TurnipZ 0.3.0 port
# (patches/tz), built twice from the same Mesa commit and recipe:
#   android - AdrenoTools zip (DroidDeck "display driver", Bannerlator, emulators)
#   linux   - glibc ICD zip, as the release's Banners-AIO-Linux (DroidDeck "runtime driver")
# Mesa pinned to the release commit in mesa_hash.txt (v27.0.0-20261108-r4) so an A/B against
# Turnip-v27.0.0-20261108-r4-Banners-AIO(-Linux).zip only differs by the port. Artifacts only.

on:
  push:
    branches: [feat/aio-tz]
    paths:
      - ".github/workflows/lab_aio_tz.yml"
      - "patches/**"
      - "build_turnip.sh"
      - "build_turnip_linux.sh"

permissions:
  contents: read

concurrency:
  group: lab-aio-tz
  cancel-in-progress: true

env:
  MESA_COMMIT: 316009797d8de1efdda53646f527821d2993ce24
  VARIANT: aio
  EXTRA_PATCH: patches/a8xx_gen8.patch
  EXTRA_SCRIPT: patches/a710-720.py:patches/one/one_gpu_gates.py:patches/one/one_fixes.py:patches/a8xx_no_double_threadsize.py:patches/tz/apply_tz.py

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      - name: Build
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Name ZIP
        id: info
        run: |
          BUILT=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo unknown)
          [ "$BUILT" = "$MESA_COMMIT" ] || { echo "::error::built Mesa ${BUILT}, wanted ${MESA_COMMIT}"; exit 1; }
          SHA=$(git rev-parse --short=8 HEAD)
          ZIP_NAME="Banners-AIO-TZ-test-${SHA}.zip"
          META_NAME="Banners-AIO TZ test ${SHA}"
          SRC=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          D=$(mktemp -d)
          unzip -q "$SRC" -d "$D"
          META_NAME="$META_NAME" python3 - "$D/meta.json" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          m = json.load(open(p))
          m["name"] = os.environ["META_NAME"]
          m["description"] = ("Banners-AIO + TurnipZ 0.3.0 port (lab): mutable/BGRA on A6xx, A650 fixes. Mesa "
                              + os.environ["MESA_COMMIT"][:7] + ".")
          json.dump(m, open(p, "w"), indent=2)
          print("meta.json:", m["name"])
          PY
          (cd "$D" && zip -q - *) > "turnip_workdir/${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "meta_name=${META_NAME}" >> "$GITHUB_OUTPUT"
          grep -a -c "rt_swap_mask_ir3" "$D/libvulkan_freedreno.so" || true

      - name: Verify ZIP
        env:
          ZIP_NAME: ${{ steps.info.outputs.zip_name }}
          META_NAME: ${{ steps.info.outputs.meta_name }}
        run: |
          python3 -c "import json,os; json.dump({k.lower(): os.environ[k] for k in ('MESA_COMMIT','EXTRA_PATCH','EXTRA_SCRIPT')}, open('build-report.json','w'))"
          python3 .github/scripts/verify_driver_zip.py --kind android \
            --zip "turnip_workdir/${ZIP_NAME}" --variant "$VARIANT" \
            --expect-name "$META_NAME" --build-report build-report.json --report report-android-tz.json

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: aio-tz-android
          path: |
            turnip_workdir/Banners-AIO-TZ-test-*.zip
            report-android-tz.json
          if-no-files-found: error

  # Same driver as a glibc ICD: the steps of the release's linux job (turnip_build_combined.yml)
  # with this branch's Mesa commit and recipe.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison cmake glslang-tools curl pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3-pip zip patch tar zstd xz-utils
          # Ubuntu ships meson 1.3; Mesa 26.x needs >= 1.4, so take it from pip.
          pip3 install --break-system-packages 'meson>=1.5' mako pyyaml packaging
          meson --version && aarch64-linux-gnu-gcc --version | head -1

      - name: Driver file name
        id: names
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          Z="Banners-AIO-TZ-test-${SHA}-Linux.zip"
          M="Banners-AIO TZ test ${SHA}-Linux"
          echo "zip=$Z" >> "$GITHUB_OUTPUT"
          echo "meta=$M" >> "$GITHUB_OUTPUT"
          echo "$Z | $M"

      - name: Build (Linux)
        env:
          ZIP_NAME: ${{ steps.names.outputs.zip }}
          META_NAME: ${{ steps.names.outputs.meta }}
          PACKAGE_VERSION: ${{ github.run_number }}
        run: |
          export META_DESC="Banners-AIO + TurnipZ 0.3.0 port (lab): mutable/BGRA on A6xx, A650 fixes. Mesa ${MESA_COMMIT:0:7}."
          chmod +x build_turnip_linux.sh
          ./build_turnip_linux.sh

      - name: Verify Linux ZIP
        env:
          ZIP_NAME: ${{ steps.names.outputs.zip }}
          META_NAME: ${{ steps.names.outputs.meta }}
          PACKAGE_VERSION: ${{ github.run_number }}
        run: |
          python3 .github/scripts/verify_driver_zip.py --kind linux \
            --zip "linux_workdir/${ZIP_NAME}" --variant "$VARIANT" \
            --expect-name "$META_NAME" --expect-package-version "$PACKAGE_VERSION" \
            --build-report linux_workdir/build-report.json --report report-linux-tz.json \
            --readelf aarch64-linux-gnu-readelf
          unzip -p "linux_workdir/${ZIP_NAME}" libvulkan_freedreno.so | grep -a -c "rt_swap_mask_ir3" || true

      - name: Upload Linux driver ZIP
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: aio-tz-linux
          path: |
            linux_workdir/${{ steps.names.outputs.zip }}
            report-linux-tz.json
          if-no-files-found: error

      - name: Upload build evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: aio-tz-linux-failed
          path: |
            linux_workdir/mesa/build-linux/meson-logs/meson-log.txt
            linux_workdir/build-report.json
            linux_workdir/sysroot-packages.txt
          if-no-files-found: ignore
