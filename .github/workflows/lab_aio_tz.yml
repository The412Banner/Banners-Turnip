name: Lab - Banners-AIO TurnipZ port

# Lab branch feat/aio-tz only, never merged as is. Android leg only: Banners-AIO recipe + the
# TurnipZ 0.3.0 port (patches/tz). Mesa pinned to the r4 release commit so the A/B against
# Turnip-v27.0.0-20261106-r4-Banners-AIO.zip only differs by the port. Artifacts only.

on:
  push:
    branches: [feat/aio-tz]
    paths:
      - ".github/workflows/lab_aio_tz.yml"
      - "patches/**"
      - "build_turnip.sh"

permissions:
  contents: read

concurrency:
  group: lab-aio-tz
  cancel-in-progress: true

env:
  MESA_COMMIT: 9187bd6a97ae438eea58b2309d0a566b46594a6f
  VARIANT: aio
  EXTRA_PATCH: patches/a8xx_gen8.patch
  EXTRA_SCRIPT: patches/a710-720.py:patches/one/one_gpu_gates.py:patches/one/one_fixes.py:patches/a8xx_no_double_threadsize.py:patches/tz/apply_tz.py

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch
          pip3 install --break-system-packages meson mako

      - name: Build
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Name ZIP
        id: info
        run: |
          BUILT=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo unknown)
          [ "$BUILT" = "$MESA_COMMIT" ] || { echo "::error::built Mesa ${BUILT}, wanted ${MESA_COMMIT}"; exit 1; }
          SHA=$(git rev-parse --short=8 HEAD)
          ZIP_NAME="Banners-AIO-TZ-test-${SHA}.zip"
          META_NAME="Banners-AIO TZ test ${SHA}"
          SRC=$(ls turnip_workdir/mesa-turnip-*.zip | head -1)
          D=$(mktemp -d)
          unzip -q "$SRC" -d "$D"
          META_NAME="$META_NAME" python3 - "$D/meta.json" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          m = json.load(open(p))
          m["name"] = os.environ["META_NAME"]
          m["description"] = "Banners-AIO + TurnipZ 0.3.0 mutable/BGRA port (lab, A6xx on). Mesa 9187bd6."
          json.dump(m, open(p, "w"), indent=2)
          print("meta.json:", m["name"])
          PY
          (cd "$D" && zip -q - *) > "turnip_workdir/${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "meta_name=${META_NAME}" >> "$GITHUB_OUTPUT"
          grep -a -c "rt_swap_mask_ir3" "$D/libvulkan_freedreno.so" || true

      - name: Verify ZIP
        env:
          ZIP_NAME: ${{ steps.info.outputs.zip_name }}
          META_NAME: ${{ steps.info.outputs.meta_name }}
        run: |
          python3 -c "import json,os; json.dump({k.lower(): os.environ[k] for k in ('MESA_COMMIT','EXTRA_PATCH','EXTRA_SCRIPT')}, open('build-report.json','w'))"
          python3 .github/scripts/verify_driver_zip.py --kind android \
            --zip "turnip_workdir/${ZIP_NAME}" --variant "$VARIANT" \
            --expect-name "$META_NAME" --build-report build-report.json --report report-android-tz.json

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: aio-tz-android
          path: |
            turnip_workdir/Banners-AIO-TZ-test-*.zip
            report-android-tz.json
          if-no-files-found: error
